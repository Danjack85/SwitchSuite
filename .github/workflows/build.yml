name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WorkBuddy 引擎（Python 侧车）已随仓库提交（src-tauri/sidecar/wbswitch），
      # 但提交前先验证它可执行、行为正常 —— 防止把坏掉的引擎发出去。
      - name: 冒烟测试 WorkBuddy 引擎（沙箱）
        shell: bash
        run: |
          export WBSWITCH_SANDBOX=1
          export WBSWITCH_STORE="$RUNNER_TEMP/store"
          export WBSWITCH_WORKBUDDY_HOME="$RUNNER_TEMP/wb"
          export WBSWITCH_AUTH_DIR="$RUNNER_TEMP/auth"
          mkdir -p "$WBSWITCH_STORE" "$WBSWITCH_WORKBUDDY_HOME" "$WBSWITCH_AUTH_DIR"
          SC="src-tauri/sidecar/wbswitch/wbswitch.exe"
          "$SC" --version
          "$SC" state --json --envelope | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'], d"
          "$SC" sessions --json --envelope | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'], d"

      - name: 前端构建
        run: |
          npm install
          npm run build
          node scripts/check-i18n-keys.mjs

      - name: Tauri 构建（NSIS）
        run: |
          npx tauri build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SwitchSuite-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 发布 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
